openapi: 3.0.3
info:
  title: BloodConnect API
  description: API for managing blood donation requests and donor notifications.
  version: 1.1.0

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /users/signup:
    post:
      summary: Register a new user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /users/login:
    post:
      summary: Authenticate a user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me:
    get:
      summary: Get current authenticated user
      tags: [Users]
      security:
        - XUserID: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/health:
    put:
      summary: Update health information for the current user
      tags: [Users]
      security:
        - XUserID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHealthRequest'
      responses:
        '204':
          description: Health info updated
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/location:
    put:
      summary: Update preferred donation location for the current user
      tags: [Users]
      security:
        - XUserID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationRequest'
      responses:
        '204':
          description: Location updated
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/notifications:
    get:
      summary: Get notifications for the current user
      tags: [Notifications]
      security:
        - XUserID: []
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/requests/{id}/respond:
    post:
      summary: Respond to a donation request as the current user
      tags: [Requests]
      security:
        - XUserID: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondRequest'
      responses:
        '204':
          description: Response recorded
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/me/requests/{id}/cancel:
    post:
      summary: Cancel a donation request owned by the current user
      tags: [Requests]
      security:
        - XUserID: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Request cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /requests:
    get:
      summary: List blood donation requests with filters
      tags: [Requests]
      parameters:
        - name: blood_type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: location_hex
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRequestsResponse'
    post:
      summary: Create a new blood donation request
      tags: [Requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequestRequest'
      responses:
        '201':
          description: Request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /requests/{id}:
    get:
      summary: Get details of a specific donation request
      tags: [Requests]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detailed request info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendedDonationRequest'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    XUserID:
      type: apiKey
      in: header
      name: X-User-ID

  schemas:
    IDResponse:
      type: object
      properties:
        id:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: object

    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        created_at: { type: string, format: date-time }

    SignupRequest:
      type: object
      required: [name, email, password, phone]
      properties:
        name: { type: string }
        email: { type: string }
        password: { type: string }
        phone: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      properties:
        id: { type: string }
        token: { type: string }

    UpdateHealthRequest:
      type: object
      required: [info_type, details]
      properties:
        info_type: { type: string }
        details: { type: string }

    UpdateLocationRequest:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }

    CreateRequestRequest:
      type: object
      required: [user_id, location_lat, location_lng, bag_count, required_by_date, blood_type, contact_phone, location_name]
      properties:
        user_id: { type: string }
        location_lat: { type: number }
        location_lng: { type: number }
        bag_count: { type: integer }
        required_by_date: { type: string, format: date-time }
        blood_type: { type: string }
        contact_phone: { type: string }
        description: { type: string }
        requester_info: { type: string }
        location_name: { type: string }

    DonationRequest:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        blood_type: { type: string }
        bag_count: { type: integer }
        status: { type: string }
        location_name: { type: string }
        created_at: { type: string, format: date-time }

    ListRequestsResponse:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/DonationRequest'
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }

    ExtendedDonationRequest:
      type: object
      properties:
        request:
          $ref: '#/components/schemas/DonationRequest'
        notified_users:
          type: array
          items:
            $ref: '#/components/schemas/ActionedUser'

    ActionedUser:
      type: object
      properties:
        user_id: { type: string }
        action: { type: string }
        lat: { type: number }
        lng: { type: number }
        h3_hex: { type: string }

    RespondRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [Accepted, Declined, Donated]

    Notification:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        recipient: { type: string }
        title: { type: string }
        content: { type: string }
        created_at: { type: string, format: date-time }

    NotificationsResponse:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
