openapi: 3.0.3
info:
  title: BloodConnect API
  description: API documentation for the BloodConnect platform.
  version: 2.0.0
servers:
  - url: http://localhost:8080
    description: Local development server

paths:

  # ── Health ────────────────────────────────────────────────────────────────

  /health:
    get:
      summary: Health check
      tags: [Health]
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # ── Users ─────────────────────────────────────────────────────────────────

  /users/signup:
    post:
      summary: Register a new user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, phone]
              properties:
                name:
                  type: string
                  example: Alice
                email:
                  type: string
                  format: email
                  example: alice@example.com
                password:
                  type: string
                  format: password
                  minLength: 6
                phone:
                  type: string
                  example: "01700000000"
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /users/login:
    post:
      summary: Authenticate a user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  token:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/{id}/health:
    put:
      summary: Update user health information
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [info_type, details]
              properties:
                info_type:
                  type: string
                  enum:
                    - blood_type
                    - weight
                    - height
                    - last_donation_date
                    - last_vaccination_date
                    - medical_condition
                details:
                  type: string
                  example: "A+"
      responses:
        '204':
          description: Updated
        '400':
          $ref: '#/components/responses/BadRequest'

  /users/{id}/location:
    put:
      summary: Update user's preferred donation location
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat:
                  type: number
                  format: double
                  example: 23.8103
                lng:
                  type: number
                  format: double
                  example: 90.4125
      responses:
        '204':
          description: Updated
        '400':
          $ref: '#/components/responses/BadRequest'

  # ── Requests ──────────────────────────────────────────────────────────────

  /requests:
    post:
      summary: Submit a blood donation request
      tags: [Requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - location_lat
                - location_lng
                - bag_count
                - required_by_date
                - blood_type
                - contact_phone
                - location_name
              properties:
                user_id:
                  type: string
                location_lat:
                  type: number
                  format: double
                location_lng:
                  type: number
                  format: double
                bag_count:
                  type: integer
                  minimum: 1
                required_by_date:
                  type: string
                  format: date-time
                blood_type:
                  type: string
                  enum: [A+, A-, B+, B-, AB+, AB-, O+, O-]
                contact_phone:
                  type: string
                description:
                  type: string
                requester_info:
                  type: string
                location_name:
                  type: string
      responses:
        '201':
          description: Request submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /requests/{id}:
    get:
      summary: Get a blood donation request with notified user locations
      tags: [Requests]
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Extended donation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendedDonationRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /requests/{id}/respond:
    post:
      summary: Respond to a blood donation request
      tags: [Requests]
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, action]
              properties:
                user_id:
                  type: string
                action:
                  type: string
                  enum: [Accepted, Declined, Donated]
      responses:
        '204':
          description: Response recorded
        '400':
          $ref: '#/components/responses/BadRequest'

  /requests/{id}/cancel:
    post:
      summary: Cancel a blood donation request
      tags: [Requests]
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  description: Must match the original requester's ID
      responses:
        '204':
          description: Request cancelled
        '400':
          $ref: '#/components/responses/BadRequest'

  # ── Notifications ─────────────────────────────────────────────────────────

  /notifications/user/{userID}:
    get:
      summary: Get all notifications for a user
      tags: [Notifications]
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'

  /notifications/{id}:
    patch:
      summary: Update notification status
      tags: [Notifications]
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [Pending, Sent, Failed, Completed]
      responses:
        '204':
          description: Status updated
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      summary: Delete a notification
      tags: [Notifications]
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '204':
          description: Deleted

# ── Reusable components ────────────────────────────────────────────────────

components:

  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string

    UserID:
      name: id
      in: path
      required: true
      description: The user's ID
      schema:
        type: string

  responses:
    BadRequest:
      description: Validation or request error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    IDResponse:
      type: object
      properties:
        id:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          description: Optional field-level validation errors
          type: object
          additionalProperties:
            type: string

    DonationRequest:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        location_hex:
          type: string
        location_lat:
          type: number
        location_lng:
          type: number
        bag_count:
          type: integer
        required_by_date:
          type: string
          format: date-time
        blood_type:
          type: string
          enum: [A+, A-, B+, B-, AB+, AB-, O+, O-]
        contact_phone:
          type: string
        description:
          type: string
        requester_info:
          type: string
        location_name:
          type: string
        status:
          type: string
          enum: [Pending, Completed, Cancelled, Failed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RequestActionedUser:
      type: object
      properties:
        user_id:
          type: string
        lat:
          type: number
        lng:
          type: number
        h3_hex:
          type: string
        action:
          type: string
          enum: [Pending, Accepted, Declined, Donated]

    ExtendedDonationRequest:
      type: object
      properties:
        request:
          $ref: '#/components/schemas/DonationRequest'
        notified_users:
          type: array
          items:
            $ref: '#/components/schemas/RequestActionedUser'

    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - blood_donation_request
            - blood_donation_completion
            - blood_donation_request_acceptance
        recipient:
          type: string
          description: User ID
        status:
          type: string
          enum: [Pending, Sent, Failed, Completed]
        title:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
