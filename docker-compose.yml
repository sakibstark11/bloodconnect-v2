version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - CGO_ENABLED=1
    
  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /foo/swagger.yaml
    volumes:
      - ./adapters/http/swagger.yaml:/foo/swagger.yaml

  web-client:
    build:
      context: ./web-client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./web-client:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
